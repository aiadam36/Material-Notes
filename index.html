<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Material Notes</title>

    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0"
    />
    <link rel="stylesheet" href="assets/css/style.css" />
  </head>
  <body>
    <header>
      <h1>Notes</h1>
      <div style="display: flex; gap: 8px">
        <a href="info.html" class="icon-btn">
          <span class="material-symbols-outlined">info</span>
        </a>
        <button class="icon-btn" onclick="exportNotes()" title="Export JSON">
          <span class="material-symbols-outlined">download</span>
        </button>
        <button
          class="icon-btn"
          onclick="document.getElementById('file-input').click()"
          title="Import JSON"
        >
          <span class="material-symbols-outlined">upload</span>
        </button>
        <input
          type="file"
          id="file-input"
          accept=".json"
          onchange="importNotes(this)"
        />
      </div>
    </header>

    <div id="notes-container"></div>

    <button class="fab" onclick="openModal()">
      <span class="material-symbols-outlined">add</span>
    </button>

    <div class="modal" id="note-modal">
      <div class="modal-content">
        <h2 id="modal-title" style="margin: 0">New Note</h2>
        <input type="text" id="note-title" placeholder="Title" />
        <textarea id="note-content" placeholder="Start typing..."></textarea>
        <div class="modal-actions">
          <button class="btn btn-text" onclick="closeModal()">Cancel</button>
          <button class="btn btn-filled" onclick="saveNote()">Save</button>
        </div>
      </div>
    </div>

    <script src="app.js"></script>
  </body>
</html>
